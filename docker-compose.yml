version: '3'
services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile-frontend
    ports:
      - "3020:3020"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: '192.168.55.111:3021'
    stdin_open: true
    tty: true

  backend:
    build:
      context: .
      dockerfile: server/dockerfile-backend
    ports:
      - "3021:3021"
    environment:
      PGSSL: disabled
      PGDATABASE: dfac
      PGUSER: postgres
      PGPASSWORD: admin
      PGHOST: 192.168.55.111
      PGPORT: 5437
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - /mnt/second/docker/crosswithfriends/pgdata/:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dfac
    ports:
      - "5437:5432"

